openmvs_bin: "/usr/local/bin/OpenMVS/"

densify:
  # Max resolution for dense reconstruction. Note: This is independent of 
  # fine_max_img_size (which is derived from the extractor config).
  # MVS can use different resolution than feature extraction.
  max_resolution: 1600
  min_resolution: 640
  sub_resolution_levels: 2
  postprocess_dmaps: true
  fusion_mode: 0

mesh:
  poisson_depth: 9
  preclean: true
  threads: null
  target_faces: 1000000
  max_hole_size: 1000000

texture:
  use_highres: true
  scale: 1.0

postprocess:
  close_holes: true
  smooth_iterations: 2
