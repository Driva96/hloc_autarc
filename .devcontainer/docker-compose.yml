services:
  hloc:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile #docker/Dockerfile.deploy or .devcontainer/Dockerfile 
    image: hloc:dev # hloc_deploy:latest or hloc:dev
    shm_size: '24gb'  # Increase this value as needed
    container_name: hloc_dev # hloc_deploy or hloc_dev  
    volumes:
      - ..:/hloc
      - /data/autarc:/data:cached # /mnt/e/data/autarc:/data:cached (home pc)
    working_dir: /hloc
    tty: true
    stdin_open: true
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8888:8888"
    # Uncomment for NVIDIA GPU support (Docker >= 19.03)
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
              driver: nvidia
    ulimits:
      stack:
        soft: -1
        hard: -1
    # Or (older syntax):
    # runtime: nvidia